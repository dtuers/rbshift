function parseRoz(tx){const r={sh:{},hn:{},err:[],n:0,h:0};
tx.replace(/^\ufeff/,'').split(/\r?\n/).forEach((ln,i)=>{ln=ln.trim();if(!ln||ln[0]=='#')return;const p=ln.split('|').map(s=>s.trim()),L='Řádek '+(i+1)+': ';
if(p.length<3)return r.err.push(L+'očekávám tři části oddělené znakem |');
if(norm(p[0])=='svatek'){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(p[1]);if(!m||new Date(+m[1],+m[2]-1,+m[3]).getMonth()!=+m[2]-1)return r.err.push(L+'neplatné datum svátku');if(!/^[^<>&"'`\\|]{1,40}$/.test(p[2]))return r.err.push(L+'název svátku: 1–40 znaků bez speciálních znaků');r.hn[p[1]]=p[2];r.h++;return}

(r.sh[tm]=r.sh[tm]||{})[p[1]]=s;r.n++});

function rFile(inp){const f=inp.files&&inp.files[0];if(!f)return;if(f.size>500000)return toast('Soubor je příliš velký');const fr=new FileReader();fr.onload=()=>{$('rt').value=String(fr.result);rChk()};fr.onerror=()=>toast('Soubor se nepodařilo přečíst');fr.readAsText(f,'utf-8')}
function applyRoz(){const r=parseRoz($('rt').value);if(r.err.length)return toast('Opravte chyby v textu');const all=$('rm').value=='all';
Object.keys(r.sh).forEach(tm=>{if(all||!SH[tm])SH[tm]={};Object.assign(SH[tm],r.sh[tm])});
if(r.h){if(all)Object.keys(HN).forEach(k=>delete HN[k]);Object.assign(HN,r.hn)}
DB.sh=SH;DB.hn=HN;rng();clampSt();const tms=Object.keys(r.sh);
Object.keys(DB.u).filter(k=>DB.u[k].role!='admin'&&(!tms.length||tms.includes(DB.u[k].team))).forEach(k=>notify(k,'Nový rozpis směn','Správce aktualizoval rozpis směn'));
save();render();toast('Rozpis načten: '+r.n+' měsíců, '+r.h+' svátků')}

// ---------- editor směn (správce): vyberu tým, štětec R/O/N/volno a klepám na dny
const sdays=(y,m)=>new Date(y,m+1,0).getDate(),mkOf=(y,m)=>y+'-'+pad(m+1);
function seGet(t,y,m){const e=st.se,mk=mkOf(y,m),dn=sdays(y,m),s=(e&&e.w[t]&&e.w[t][mk])||(SH[t]||{})[mk]||'';return (s+'-'.repeat(31)).slice(0,dn)}
function seCnt(){const e=st.se;let n=0;Object.keys(e.w).forEach(t=>Object.keys(e.w[t]).forEach(mk=>{const [y,m]=mk.split('-').map(Number),a=e.w[t][mk],b=((SH[t]||{})[mk]||'');for(let i=0;i<a.length;i++)if(a[i]!=(b[i]||'-'))n++}));return n}
function openSE(){const y=st.y,m=st.m;st.se={t:TEAMS[0],b:'R',w:{},h:[],y,m,n:true,cf:0};render()}
function seSet(k,v){st.se[k]=v;st.se.cf=0;render()}
function seMon(d){const e=st.se,i=Math.min(MAXI+12,Math.max(MINI,e.y*12+e.m+d));e.y=Math.floor(i/12);e.m=i%12;render()}
function paint(k){const e=st.se,[y,mo,d]=k.split('-').map(Number),m=mo-1,mk=mkOf(y,m),s=seGet(e.t,y,m).split('');if(s[d-1]==e.b)return;
e.h.push({t:e.t,mk,prev:e.w[e.t]&&e.w[e.t][mk]});s[d-1]=e.b;(e.w[e.t]=e.w[e.t]||{})[mk]=s.join('');e.cf=0;
const mm=$('m'),sy=mm.scrollTop;render();mm.scrollTop=sy}
function seUndo(){const e=st.se,x=e.h.pop();if(!x)return;if(x.prev===undefined)delete e.w[x.t][x.mk];else e.w[x.t][x.mk]=x.prev;const mm=$('m'),sy=mm.scrollTop;render();mm.scrollTop=sy}
function seClose(){const e=st.se,n=seCnt();if(n&&!e.cf){e.cf=1;render();return toast('Neuložené změny: klepněte znovu pro zahození')}st.se=null;render()}
function seSave(){const e=st.se,n=seCnt();if(!n)return;const tms=[];
Object.keys(e.w).forEach(t=>{Object.keys(e.w[t]).forEach(mk=>{(SH[t]=SH[t]||{})[mk]=e.w[t][mk]});if(Object.keys(e.w[t]).length)tms.push(t)});
DB.sh=SH;rng();clampSt();
if(e.n)Object.keys(DB.u).filter(k=>DB.u[k].role!='admin'&&tms.includes(DB.u[k].team)).forEach(k=>notify(k,'Rozpis směn upraven','Správce upravil rozpis týmu '+DB.u[k].team));
e.w={};e.h=[];e.cf=0;save();render();toast('Rozpis uložen ('+n+' '+(n==1?'den':n<5?'dny':'dnů')+' změněno)')}
function seCov(){const e=st.se,{y,m}=e,mk=mkOf(y,m);if(!TEAMS.every(t=>(SH[t]&&SH[t][mk])||(e.w[t]&&e.w[t][mk])))return '';
const bad=[];for(let d=1;d<=sdays(y,m);d++){const c={R:0,O:0,N:0};TEAMS.forEach(t=>{const s=seGet(t,y,m)[d-1];if(c[s]!=null)c[s]++});const p=[];['R','O','N'].forEach(s=>{if(!c[s])p.push('chybí '+s);else if(c[s]>1)p.push(s+' ×'+c[s])});if(p.length)bad.push(d+'. ('+p.join(', ')+')')}
return bad.length?`<div class="card" style="border-left:4px solid #8A5A00"><b class="warn">Obsazení směn (informativní)</b><div class="meta" style="margin:3px 0 0">${bad.slice(0,8).join(' · ')}${bad.length>8?' · … dalších '+(bad.length-8):''}</div></div>`:`<div class="meta ok" style="margin:0">✓ Každý den má tento měsíc ranní, odpolední i noční směnu právě jednou.</div>`}
function se(){const e=st.se,{y,m}=e,first=(new Date(y,m,1).getDay()+6)%7,dn=sdays(y,m),mk=mkOf(y,m),n=seCnt(),cur=seGet(e.t,y,m),orig=(SH[e.t]||{})[mk]||'';
let c='';for(const d of 'PÚSČPSN')c+=`<div class="h">${d}</div>`;for(let i=0;i<first;i++)c+='<div></div>';
for(let d=1;d<=dn;d++){const k=key(y,m,d),s=cur[d-1],sc=s=='-'?'':s,chg=(orig[d-1]||'-')!=s,hl=HN[k];
c+=`<button class="day ${sc||'free'}${hl?' hol':''}${chg?' chg':''}${k==TD?' today':''}" onclick="paint('${k}')" aria-label="${d}. ${MN[m].toLowerCase()}${sc?', '+SN[sc]+' směna':', volno'}${chg?', změněno':''}${hl?', svátek '+hl:''}">${d}<small>${sc||'&nbsp;'}</small></button>`}
const BR=[['R','R ranní','#CFEBCB'],['O','O odpolední','#FFD8A8'],['N','N noční','#007BC0'],['-','Volno','#fff']],off='style="color:#4A5560;border-color:#8A949E"';
return `<div class="card fld"><div class="row"><b>Editor směn</b><button class="btn sec" onclick="seClose()">${e.cf?'Zahodit a zavřít':'Zavřít'}</button></div>
<div class="lbl">1. Tým</div><div class="chips">${TEAMS.map(t=>`<button class="chip" aria-pressed="${t==e.t}" onclick="seSet('t','${t}')">${t}</button>`).join('')}</div>
<div class="lbl">2. Směna (štětec)</div><div class="brush">${BR.map(b=>`<button class="chip" aria-pressed="${b[0]==e.b}" onclick="seSet('b','${b[0]}')"><i class="sw" style="background:${b[2]}"></i>${b[1]}</button>`).join('')}</div>
<div class="lbl">3. Klepejte na dny v kalendáři, vybraná směna se do nich zapíše.</div></div>
<div class="card"><div class="row" style="margin-bottom:10px"><button class="mn" aria-label="Předchozí" onclick="seMon(-1)">‹</button><b style="font-size:16px">${MN[m]} ${y} · ${e.t}</b><button class="mn" aria-label="Další" onclick="seMon(1)">›</button></div><div class="cal">${c}</div>
<div class="leg"><span><i class="sw" style="background:#CFEBCB"></i>R ranní</span><span><i class="sw" style="background:#FFD8A8"></i>O odpolední</span><span><i class="sw" style="background:#007BC0"></i>N noční</span><span><i class="sw" style="border:2px dashed var(--ink)"></i>změněný den</span><span><i class="sw" style="border:2px solid #ED0007"></i>svátek</span></div></div>
${seCov()}
<label class="row" style="justify-content:flex-start;gap:8px;font-size:14px"><input type="checkbox" ${e.n?'checked':''} onchange="st.se.n=this.checked"> Po uložení upozornit zaměstnance a vedoucí týmu</label>
<div class="row"><button class="btn sec" style="flex:1" ${e.h.length?'':'disabled '+off} onclick="seUndo()">Zpět</button><button class="btn" style="flex:2" ${n?'':'disabled '+off} onclick="seSave()">${n?'Uložit změny ('+n+')':'Žádné změny'}</button></div>`}
function roz(){if(st.se)return se();const yrs=[...new Set(TEAMS.flatMap(x=>Object.keys(SH[x]||{}).map(m=>m.slice(0,4))))].sort();
const cov=TEAMS.map(x=>{const ks=Object.keys(SH[x]||{}).sort();return `<div class="lbl" style="font-size:13px"><b style="color:var(--ink)">${x}</b>: ${ks.length?ks[0]+' až '+ks[ks.length-1]+' ('+ks.length+' měs.)':'bez rozpisu'}</div>`}).join('');
return `<div class="card fld"><b>Upravit směny v kalendáři</b><div class="meta" style="margin:0">Vyberte tým a směnu (R, O, N nebo volno) a klepejte na dny v kalendáři. Změny se uloží najednou.</div><button class="btn" onclick="openSE()">Otevřít editor</button></div>
<div class="card fld"><b>Export rozpisu (TXT)</b><label>Rok<select id="xy"><option value="">Všechny roky</option>${yrs.map(y=>`<option>${y}</option>`).join('')}</select></label><div class="meta" style="margin:0">Rozpis směn všech týmů (vedoucích) a státní svátky v textovém souboru.</div><button class="btn" onclick="doExp()">Exportovat</button></div>
<div class="card fld"><b>Načíst nový rozpis</b><div class="meta" style="margin:0">Pro nový rok nebo po změnách. Postup: export, úprava v textovém editoru, načtení. Formát je stejný jako v exportu.</div><label>Soubor .txt<input type="file" id="rf" accept=".txt,text/plain" onchange="rFile(this)"></label><label>Nebo vložte text<textarea id="rt" oninput="rChk()" spellcheck="false"></textarea></label><label>Režim<select id="rm"><option value="merge">Přepsat jen měsíce uvedené v textu</option><option value="all">Nahradit celý rozpis týmů uvedených v textu</option></select></label><div id="rs" role="status" style="font-size:13px;line-height:1.5"></div><button class="btn" id="rb" disabled onclick="applyRoz()">Načíst rozpis</button></div>
<div class="card"><b style="font-size:14px">Aktuálně nahráno</b><div style="margin-top:6px">${cov}</div></div>`}
function lim(){const c=DB.cfg;return `<div class="card fld"><b>Pravidla pro přesčasy</b><label>Limit přesčasů na zaměstnance za měsíc (hodin)<input type="number" id="lo" min="0" max="200" step="0.5" value="${c.ot}"></label><label>Minimální doba odpočinku mezi směnami (hodin)<input type="number" id="lr" min="0" max="24" step="0.5" value="${c.rest}"></label><label>Maximum odpracovaných hodin za 24 hodin (hodin)<input type="number" id="lm" min="1" max="24" step="0.5" value="${c.max}"></label><div class="meta" style="margin:0">Vedoucí u každé přihlášky na přesčas uvidí, zda zaměstnanec pravidla splňuje, kdy naposled skončil v práci a kolikrát měl přesčas v měsíci. Přihlášku, která pravidla porušuje, nelze schválit.</div><button class="btn" onclick="saveLim()">Uložit</button></div>`}
function saveLim(){const o=parseFloat($('lo').value),r=parseFloat($('lr').value),m=parseFloat($('lm').value);if(!(o>=0&&o<=200))return toast('Limit přesčasů: 0–200 hodin');if(!(r>=0&&r<=24))return toast('Odpočinek: 0–24 hodin');if(!(m>=1&&m<=24))return toast('Maximum za 24 hodin: 1–24 hodin');DB.cfg={ot:o,rest:r,max:m};save();render();toast('Limity uloženy')}
function ved(){const Ls=Object.keys(DB.u).filter(k=>DB.u[k].role=='leader'),Es=Object.keys(DB.u).filter(k=>DB.u[k].role=='emp'),tms=[...new Set([...TEAMS,...Ls.map(k=>DB.u[k].team),...Es.map(k=>DB.u[k].team)])];
const row=(k,sub,code)=>`<div class="card row"><div><b style="font-size:15px">${esc(DB.u[k].name)}</b><div class="lbl" style="font-size:13px">${esc(sub)}</div></div><button class="btn sec" onclick="${code}">Upravit</button></div>`;
const none='<div class="card meta" style="margin:0">Nikdo zatím není.</div>';
return `<button class="btn" onclick="openLeader()">Nový vedoucí</button><h2>Vedoucí (${Ls.length})</h2>`+(tms.map(tm=>Ls.filter(k=>DB.u[k].team==tm).map(k=>row(k,'vedoucí · tým '+tm,`st.cd=false;editLeader('${k}')`)).join('')).join('')||none)+`<h2>Zaměstnanci (${Es.length})</h2>`+(Es.length?tms.map(tm=>{const E=Es.filter(k=>DB.u[k].team==tm);return E.length?`<h2 style="color:var(--ink)">Tým ${esc(tm)} (${E.length})</h2>`+E.map(k=>row(k,(DB.u[k].pos||'Operátor')+' · tým '+tm,`st.cdA=false;editEmp('${k}')`)).join(''):''}).join(''):'<div class="card meta" style="margin:0">Zatím se nikdo nezaregistroval.</div>')}
function editLeader(k){st.adm=k;const l=DB.u[k];sheet(`<b style="font-size:18px">Upravit vedoucího</b><div class="fld"><label>Jméno (přihlašovací)<input id="an" value="${esc(l.name)}"></label><label>Tým<select id="at">${TEAMS.map(x=>`<option${x==l.team?' selected':''}>${x}</option>`).join('')}</select></label><label>Nové heslo (prázdné = beze změny)<input id="ap" type="password" autocomplete="new-password"></label></div><div class="row"><button class="btn sec" style="flex:1" onclick="delLeader()">${st.cd?'Opravdu smazat?':'Smazat'}</button><button class="btn" style="flex:1" onclick="saveLeader()">Uložit</button></div>`,'#007BC0')}
function editEmp(k){st.ae=k;const e=DB.u[k],ep=e.pos||'Operátor';sheet(`<b style="font-size:18px">Upravit zaměstnance</b><div class="fld"><label>Jméno (přihlašovací)<input id="en" value="${esc(e.name)}"></label><label>Nové heslo (prázdné = beze změny)<input id="ep" type="password" autocomplete="new-password"></label><label>Tým<select id="et">${TEAMS.map(x=>`<option${x==e.team?' selected':''}>${x}</option>`).join('')}</select></label><label>Pozice<select id="epo">${POS.map(x=>`<option${x==ep?' selected':''}>${x}</option>`).join('')}</select></label></div><div class="row"><button class="btn sec" style="flex:1" onclick="delAdminEmp()">${st.cdA?'Opravdu smazat?':'Smazat'}</button><button class="btn" style="flex:1" onclick="saveEmp()">Uložit</button></div>`,'#007BC0')}
async function saveEmp(){const o=st.ae,n=$('en').value.trim().replace(/\s+/g,' '),p=$('ep').value;if(!NAMEOK.test(n))return toast('Jméno: 2–30 znaků, písmena a mezery');if(p&&p.length<8)return toast('Heslo musí mít alespoň 8 znaků');
const nk=norm(n);if(nk!=o&&DB.u[nk])return toast('Toto jméno už existuje');
const b={username:o,name:n,password:p,team:$('et').value,pos:$('epo').value};closeDlg();await adm('update',b,'Zaměstnanec uložen')}
async function delAdminEmp(){if(!st.cdA){st.cdA=true;editEmp(st.ae);return}const k=st.ae;st.cdA=false;st.ae=null;closeDlg();await adm('delete',{username:k},'Zaměstnanec smazán')}
async function saveLeader(){const o=st.adm,n=$('an').value.trim().replace(/\s+/g,' '),p=$('ap').value;if(!NAMEOK.test(n))return toast('Jméno: 2–30 znaků, písmena a mezery');if(p&&p.length<8)return toast('Heslo musí mít alespoň 8 znaků');
const nk=norm(n);if(nk!=o&&DB.u[nk])return toast('Toto jméno už existuje');
const b={username:o,name:n,password:p,team:$('at').value};closeDlg();await adm('update',b,'Vedoucí uložen')}
async function delLeader(){if(!st.cd){st.cd=true;editLeader(st.adm);return}const k=st.adm;st.cd=false;st.adm=null;closeDlg();await adm('delete',{username:k},'Vedoucí smazán')}
function openLeader(){sheet(`<b style="font-size:18px">Nový vedoucí</b><div class="fld"><label>Jméno<input id="nn"></label><label>Tým<select id="nt">${TEAMS.map(t=>`<option>${t}</option>`).join('')}</select></label><label>Heslo (min. 8 znaků)<input id="np" type="password" autocomplete="new-password"></label></div>${btns('addLeader()','Vytvořit')}`,'#ED0007')}
async function addLeader(){const n=$('nn').value.trim().replace(/\s+/g,' '),p=$('np').value,k=norm(n);if(!NAMEOK.test(n))return toast('Jméno: 2–30 znaků, písmena a mezery');if(p.length<8)return toast('Heslo musí mít alespoň 8 znaků');if(DB.u[k])return toast('Toto jméno už existuje');
const b={name:n,team:$('nt').value,password:p};closeDlg();await adm('create_leader',b,'Vedoucí vytvořen')}
// ---------- render
function render(){const u=U();
if(!u){$('t').textContent='Přihlášení';$('s').textContent='Směnný provoz';$('who').textContent='';$('m').innerHTML=BOOT?'<div class="card meta" style="margin:0">Načítání…</div>':login();$('nav').innerHTML='';return}
if(!TB[u.role].find(x=>x[0]==st.tab))st.tab=TB[u.role][0][0];
const t=TT(u)[st.tab];$('t').textContent=t[0];$('s').textContent=t[1];$('who').textContent=u.name+' · '+(u.role=='emp'&&u.pos?u.pos:RL[u.role]);
$('m').innerHTML={sm,pres,nem,zad,ved,lim,pre,roz,prof}[st.tab]();nav()}
render();
// ---------- zvuk a živá synchronizace oznámení
let AC=null;
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission()}catch(e){}}
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,unlockAudio,{passive:true}));
function beep(){try{unlockAudio();if(AC)[0,.25,.5].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+d;o.type='sine';o.frequency.value=i==1?1180:880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.2);o.start(t0);o.stop(t0+.22)});navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
// ---------- push notifikace (telefon)
const PUSHOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
async function pushSub(ask){if(!PUSHOK()||!UID)return false;
const reg=await navigator.serviceWorker.ready;
if(Notification.permission=='default'&&ask)await Notification.requestPermission();
if(Notification.permission!='granted')return false;
let s=await reg.pushManager.getSubscription();
if(s){try{const k=s.options&&s.options.applicationServerKey;if(k){const a=new Uint8Array(k),b=b64(CFG.vapid);if(a.length!=b.length||a.some((v,i)=>v!==b[i])){await sb.from('push_subs').delete().eq('endpoint',s.endpoint);await s.unsubscribe();s=null}}}catch(e){}}
if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(CFG.vapid)});
const j=s.toJSON();
const {error}=await sb.from('push_subs').upsert({endpoint:j.endpoint,user_id:UID,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
return !error}
async function pushOff(){if(!PUSHOK())return;const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();if(s){await sb.from('push_subs').delete().eq('endpoint',s.endpoint);await s.unsubscribe()}}
function pushInit(){try{if(PUSHOK()&&Notification.permission=='granted')pushSub(false).catch(()=>{})}catch(e){}}
async function enPush(){let ok=false;try{ok=await pushSub(true)}catch(e){}toast(ok?'Upozornění zapnuta':'Upozornění se nepodařilo zapnout – povolte je v nastavení telefonu');render()}
function pushCard(){if(!ME)return '';
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),inst=navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
if(ios&&!inst)return `<div class="card" style="border-left:4px solid #007BC0"><b>Upozornění na telefonu</b><div class="meta" style="margin:3px 0 0">Na iPhonu klepněte v Safari na Sdílet → Přidat na plochu, spusťte aplikaci z plochy a zapněte upozornění.</div></div>`;
if(!PUSHOK()||Notification.permission=='granted')return '';
if(Notification.permission=='denied')return `<div class="card" style="border-left:4px solid #C8000A"><b>Upozornění jsou zablokovaná</b><div class="meta" style="margin:3px 0 0">Povolte oznámení pro tuto aplikaci v nastavení telefonu.</div></div>`;
return `<div class="card row"><div><b>Zapnout upozornění</b><div class="lbl" style="font-size:13px">Nabídky přesčasů a schválení hned v telefonu</div></div><button class="btn" onclick="enPush()">Zapnout</button></div>`}
// ---------- spuštění
setInterval(()=>{if(needR&&ME&&!$('dlg').innerHTML&&!/INPUT|SELECT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){needR=false;render()}},2000);
setInterval(()=>{if(UID&&!document.hidden)pull(true)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&UID)pull(true)});
window.addEventListener('online',()=>{if(UID){listen();pull(true)}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{try{const {data}=await sb.auth.getSession();if(data.session){UID=data.session.user.id;await pull(true);if(ME){listen();st.tab=TB[DB.u[ME].role][0][0];pushInit()}else{await sb.auth.signOut();UID=null}}}catch(e){}BOOT=false;render()})();

</script>
</body>
</html>
